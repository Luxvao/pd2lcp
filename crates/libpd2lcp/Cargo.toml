[package]
name = "libpd2lcp"
version = "1.0.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
hex = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.13.4" }
serde = { version = "1.0.229", features = ["derive"] }
