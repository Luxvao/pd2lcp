name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t pd2lcp-builder -f Containerfile .

      - name: Build release
        run: docker run --rm -v "$PWD:/build" pd2lcp-builder

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
